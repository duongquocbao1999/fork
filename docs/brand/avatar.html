<!doctype html><html><head><meta charset="utf-8"><style>
* { margin: 0; box-sizing: border-box; }
html, body { width: 400px; height: 400px; background: #0d1117; overflow: hidden; }
body { position: relative; }
.bg { position: absolute; inset: 0; background:
  radial-gradient(220px 220px at 50% 46%, rgba(63,185,80,.20), transparent 70%),
  radial-gradient(160px 160px at 66% 26%, rgba(210,153,34,.20), transparent 70%), #0d1117; }
.grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(240,246,252,.10) 1.2px, transparent 1.4px); background-size: 20px 20px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0 42%, transparent 70%); }
svg { position: absolute; inset: 0; }
</style></head><body><div class="bg"></div><div class="grid"></div>
<!-- the mark: the trunk (the line a repo came from), its fork, and the coin at the tip -->
<svg width="400" height="400" viewBox="0 0 400 400">
  <defs><radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f2c46d" stop-opacity=".75"/><stop offset="1" stop-color="#f2c46d" stop-opacity="0"/></radialGradient></defs>
  <g fill="none" stroke-linecap="round">
    <path d="M168 318 V 96" stroke="#3fb950" stroke-width="30"/>
    <path d="M168 236 C 168 176, 262 186, 262 128" stroke="#3fb950" stroke-width="30"/>
  </g>
  <circle cx="168" cy="318" r="30" fill="#3fb950"/>
  <circle cx="168" cy="96" r="20" fill="#0d1117" stroke="#3fb950" stroke-width="12"/>
  <circle cx="262" cy="112" r="74" fill="url(#g)"/>
  <circle cx="262" cy="112" r="34" fill="#d29922"/>
  <circle cx="262" cy="112" r="34" fill="none" stroke="#f2c46d" stroke-width="4" opacity=".9"/>
  <circle cx="252" cy="102" r="9" fill="#fff" opacity=".28"/>
</svg>
</body></html>
