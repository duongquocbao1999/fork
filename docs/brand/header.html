<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Anybody'; src: url(../../fonts/anybody.woff2) format('woff2'); font-weight: 100 900; font-stretch: 50% 150%; }
@font-face { font-family: 'JBM'; src: url(../../fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1500px; height: 500px; background: #0d1117; overflow: hidden; color: #f0f6fc; }
body { position: relative; font-family: Inter, 'DejaVu Sans', sans-serif; }
.bg { position: absolute; inset: 0; background:
  radial-gradient(520px 300px at 1240px 170px, rgba(63,185,80,.16), transparent 70%),
  radial-gradient(360px 220px at 1300px 150px, rgba(210,153,34,.16), transparent 70%),
  radial-gradient(700px 360px at 0 0, rgba(56,139,253,.07), transparent 70%), #0d1117; }
.grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(240,246,252,.09) 1.3px, transparent 1.5px); background-size: 28px 28px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 35%, #000 100%); }
.txt { position: absolute; left: 84px; top: 96px; width: 600px; }
.k { font: 600 17px JBM; letter-spacing: .14em; text-transform: uppercase; color: #3fb950; display: flex; align-items: center; gap: 12px; }
.k i { width: 9px; height: 9px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 0 6px rgba(63,185,80,.18); }
h1 { margin-top: 20px; font: 800 58px/1.04 Anybody, sans-serif; font-stretch: 100%; letter-spacing: -.02em; white-space: nowrap; }
h1 .g { color: #3fb950; } h1 .a { color: #d29922; }
.url { position: absolute; right: 74px; bottom: 58px; font: 500 22px JBM; color: #9198a1; letter-spacing: .02em; }
.url b { color: #f0f6fc; font-weight: 600; }
svg { position: absolute; left: 0; top: 0; }
svg text { font-family: JBM; }
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="txt"><p class="k"><i></i>the family tree of code</p>
<h1>Every repo<br>has a <span class="g">lineage</span>.<br>Some have <span class="a">coins</span>.</h1></div>
<svg width="1500" height="500" viewBox="0 0 1500 500">
  <defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f2c46d" stop-opacity=".6"/><stop offset="1" stop-color="#f2c46d" stop-opacity="0"/></radialGradient></defs>
  <g fill="none" stroke-linecap="round">
    <!-- side branches -->
    <path d="M840 300 C 900 300, 900 390, 970 390" stroke="#3d444d" stroke-width="5"/>
    <path d="M1000 250 C 1060 250, 1050 120, 1110 110" stroke="#3d444d" stroke-width="5"/>
    <path d="M1110 110 L 1210 96" stroke="#3d444d" stroke-width="5"/>
    <path d="M1000 250 C 1050 250, 1060 350, 1120 360" stroke="#3d444d" stroke-width="5"/>
    <!-- the line: git → bitcoin → solana → pump.fun → forks -->
    <path d="M700 340 C 760 340, 770 300, 840 300 S 940 250, 1000 250 S 1100 205, 1160 205 S 1260 160, 1330 160" stroke="#3fb950" stroke-width="9"/>
  </g>
  <circle cx="700" cy="340" r="13" fill="#3fb950"/>
  <circle cx="840" cy="300" r="11" fill="#3fb950"/><circle cx="1000" cy="250" r="11" fill="#3fb950"/><circle cx="1160" cy="205" r="11" fill="#3fb950"/>
  <circle cx="970" cy="390" r="8" fill="#0d1117" stroke="#9198a1" stroke-width="4"/>
  <circle cx="1110" cy="110" r="8" fill="#0d1117" stroke="#9198a1" stroke-width="4"/><circle cx="1210" cy="96" r="8" fill="#0d1117" stroke="#9198a1" stroke-width="4"/>
  <circle cx="1120" cy="360" r="8" fill="#0d1117" stroke="#9198a1" stroke-width="4"/>
  <circle cx="1330" cy="160" r="84" fill="url(#gl)"/>
  <circle cx="1330" cy="160" r="22" fill="#d29922"/><circle cx="1330" cy="160" r="36" fill="none" stroke="#d29922" stroke-width="3" opacity=".55"/>
  <g font-size="19" font-weight="600" fill="#f0f6fc">
    <text x="700" y="380" text-anchor="middle">git</text>
    <text x="840" y="275" text-anchor="middle">bitcoin</text><text x="840" y="338" text-anchor="middle" fill="#4493f8" font-weight="700">$BTC</text>
    <text x="1000" y="225" text-anchor="middle" dy="-4">solana</text><text x="1000" y="290" text-anchor="middle" fill="#4493f8" font-weight="700">$SOL</text>
    <text x="1160" y="180" text-anchor="middle" dy="-4">pump.fun</text><text x="1160" y="245" text-anchor="middle" fill="#4493f8" font-weight="700">$PUMP</text>
    <text x="1330" y="226" text-anchor="middle" font-size="24" font-weight="800">your repo</text><text x="1330" y="254" text-anchor="middle" fill="#d29922" font-weight="700">$COIN</text>
  </g>
  <g font-size="16" fill="#9198a1">
    <text x="990" y="396">ethereum <tspan fill="#4493f8" font-weight="700">$ETH</tspan></text>
    <text x="1110" y="86" text-anchor="middle">agave</text><text x="1226" y="78" text-anchor="middle">jito <tspan fill="#4493f8" font-weight="700">$JTO</tspan></text>
    <text x="1138" y="366">anchor</text>
  </g>
</svg>
<p class="url"><b>forks.wiki</b> · trace any repo · launch its coin</p>
</body></html>
