name: Check data

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every file parses
        run: for f in src/*.js netlify/functions/*.mjs netlify/lib/*.mjs scripts/*.cjs; do node --check "$f"; done
      - name: The brief parses a sample answer
        run: node -e "const P=require('./src/prompt.js');const t=P.shape(P.parse('{\"t\":\"x\",\"f\":1,\"n\":[[\"a/b\",null,\"\",\"\"],[\"c/d\",0,\"fork\",\"y\"]],\"l\":\"z\"}'));if(!t||t.nodes.length!==2)process.exit(1)"
