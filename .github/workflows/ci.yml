name: Check data

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.cjs
      - name: Generated files are up to date (archive.js, upstream.mjs)
        run: node scripts/build-archive.cjs && node scripts/build-upstream.cjs && git diff --exit-code src/archive.js netlify/lib/upstream.mjs
      - name: Charts still build
        run: node scripts/charts.cjs
