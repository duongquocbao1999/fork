name: Check data

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every file parses
        run: for f in src/*.js netlify/functions/*.mjs netlify/lib/*.mjs scripts/*.cjs; do node --check "$f"; done
      - name: upstream.mjs is up to date with brain.js
        run: node scripts/build-upstream.cjs && git diff --exit-code netlify/lib/upstream.mjs
