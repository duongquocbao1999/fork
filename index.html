<style>
/* Layout concept: one question, one conversation, one living tree. The canvas behind
   everything is a single canopy forking from an origin off the left edge; the UI is a
   narrow column of plain text and hairline cards floating over it. */
:root {
  --bg: #090B0A;
  --bg-2: #0F1311;
  --bg-3: #151A17;
  --ink: #E7ECE9;
  --ink-2: #A2ACA7;
  --ink-3: #66706B;
  --rule: rgba(231, 236, 233, .09);
  --rule-2: rgba(231, 236, 233, .17);
  --acc: #6EE7B7;
  --acc-soft: rgba(110, 231, 183, .12);
  --acc-ink: #06110C;
  --warn: #E8B45A;
  --err: #FF7A6B;
  --field-ink: #D7E0DB;
  --veil: rgba(9, 11, 10, .72);

  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --col: min(720px, calc(100vw - 32px));
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F5F2; --bg-2: #FFFFFF; --bg-3: #EAEEEA; --ink: #0E1311; --ink-2: #4C5651; --ink-3: #8A938E;
    --rule: rgba(14, 19, 17, .10); --rule-2: rgba(14, 19, 17, .18); --acc: #0B8F62; --acc-soft: rgba(11, 143, 98, .10); --acc-ink: #F3F5F2;
    --warn: #A66A00; --err: #C2412F; --field-ink: #23302A; --veil: rgba(243, 245, 242, .78); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F3F5F2; --bg-2: #FFFFFF; --bg-3: #EAEEEA; --ink: #0E1311; --ink-2: #4C5651; --ink-3: #8A938E;
  --rule: rgba(14, 19, 17, .10); --rule-2: rgba(14, 19, 17, .18); --acc: #0B8F62; --acc-soft: rgba(11, 143, 98, .10); --acc-ink: #F3F5F2;
  --warn: #A66A00; --err: #C2412F; --field-ink: #23302A; --veil: rgba(243, 245, 242, .78); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.65 var(--mono); font-feature-settings: 'zero', 'calt';
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
::selection { background: var(--acc); color: var(--acc-ink); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#field { position: fixed; inset: 0; z-index: 0; display: block; }

/* ---------- top ---------- */
.top { position: fixed; z-index: 20; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px var(--gut-r) 0 var(--gut); pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; font: 500 15px/1 var(--mono); letter-spacing: -.02em; }
.mark { width: 20px; height: 20px; flex: none; }
.mark path { fill: none; stroke: var(--acc); stroke-width: 2.1; stroke-linecap: round; }
.mark .d { fill: var(--acc); } .mark .e { fill: var(--bg); stroke: var(--acc); stroke-width: 1.5; }
.pills { display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--rule-2); background: var(--veil); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 400 12px/1 var(--mono); color: var(--ink-2); text-decoration: none; transition: color .15s, border-color .15s; }
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.pill .dot.on { background: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.pill.icon { width: 30px; padding: 0; justify-content: center; }
.pill svg { width: 14px; height: 14px; }
#newBtn { display: none; }
.pill .mob { display: none; }
.pill { white-space: nowrap; }
body.chat .top { background: linear-gradient(var(--bg) 55%, transparent); padding-bottom: 18px; }
body.chat #newBtn { display: inline-flex; }

/* ---------- hero ---------- */
main { position: relative; z-index: 2; }
.hero { position: relative; overflow-x: clip; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 90px var(--gut-r) 110px var(--gut); text-align: center; }
.hero::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; width: min(1100px, 100vw); height: min(760px, 110vh); transform: translate(-50%, -50%); background: radial-gradient(closest-side, var(--bg) 0%, color-mix(in srgb, var(--bg) 82%, transparent) 55%, transparent 100%); pointer-events: none; }
.q { margin: 0; font: 400 clamp(46px, 7.4vw, 104px)/.95 var(--serif); letter-spacing: -.025em; text-wrap: balance; position: relative; }
.q em { font-style: italic; color: var(--acc); }
.q .w { display: inline-block; opacity: 0; transform: translateY(.18em); filter: blur(6px); animation: wIn .9s var(--ease) forwards; }
@keyframes wIn { to { opacity: 1; transform: none; filter: none; } }
.q-fork { display: block; margin: 6px auto 0; width: min(420px, 70vw); height: 22px; overflow: visible; }
.q-fork path { fill: none; stroke: var(--acc); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) 1s forwards; }
.q-fork circle { fill: var(--bg); stroke: var(--acc); stroke-width: 1.4; opacity: 0; animation: pop .3s ease 2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { to { opacity: 1; } }

/* ---------- ask ---------- */
.ask { width: var(--col); position: relative; }
.ask-row { display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 18px; border-radius: 18px; border: 1px solid var(--rule-2); background: var(--veil); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: border-color .2s, box-shadow .2s; }
.ask-row:focus-within { border-color: color-mix(in srgb, var(--acc) 55%, transparent); box-shadow: 0 0 0 6px var(--acc-soft); }
.ask-row::before { content: "›"; color: var(--acc); font: 500 18px/1 var(--mono); }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 15px/1.3 var(--mono); padding: 11px 2px; outline: none; caret-color: var(--acc); }
.ask input::placeholder { color: var(--ink-3); }
.send { width: 42px; height: 42px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; transition: transform .15s var(--ease), opacity .15s; }
.send:active { transform: translateY(1px) scale(.97); }
.send[disabled] { opacity: .35; cursor: default; }
.send svg { width: 18px; height: 18px; }
.send svg path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: var(--col); }
.chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--veil); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 400 12.5px/1.2 var(--mono); color: var(--ink-2); transition: color .15s, border-color .15s, transform .15s var(--ease); }
.chip:hover { color: var(--ink); border-color: var(--rule-2); }
.chip:active { transform: scale(.97); }
.fine { position: fixed; z-index: 3; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center; padding: 0 var(--gut-r) 0 var(--gut); font: 400 11px/1.5 var(--mono); color: var(--ink-3); pointer-events: none; transition: opacity .3s; }
body.chat .fine { opacity: 0; }

/* ---------- chat ---------- */
body.chat .hero { display: none; }
.thread { list-style: none; margin: 0 auto; padding: calc(84px + env(safe-area-inset-top, 0px)) 0 170px; width: var(--col); display: none; flex-direction: column; gap: 26px; }
body.chat .thread { display: flex; }
.msg { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.msg.you { align-self: flex-end; max-width: 82%; padding: 10px 14px; border-radius: 14px 14px 4px 14px; border: 1px solid var(--rule-2); background: var(--veil); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.up { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; }
.av { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--bg-2); display: grid; place-items: center; margin-top: 1px; }
.av .mark { width: 15px; height: 15px; }
.who { font: 400 11px/1 var(--mono); color: var(--ink-3); margin: 6px 0 8px; display: flex; gap: 10px; align-items: center; }
.who .src { color: var(--ink-3); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 7px; font-size: 10px; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); text-shadow: 0 0 12px var(--bg), 0 0 2px var(--bg); }
.txt .caret { display: inline-block; width: .55em; height: 1.05em; background: var(--acc); vertical-align: -.18em; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.thinking { color: var(--ink-3); display: inline-flex; gap: 10px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); animation: thk 1.1s var(--ease) infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes thk { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: none; } }
.follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.follow .chip { font-size: 12px; padding: 6px 10px; }
.stop { margin-left: 8px; font-size: 11px; color: var(--ink-3); border-bottom: 1px dotted var(--ink-3); }

/* ---------- cards ---------- */
.card { margin-top: 14px; border: 1px solid var(--rule-2); border-radius: 14px; background: color-mix(in srgb, var(--bg-2) 97%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow: hidden; animation: rise .5s var(--ease) both; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule); font: 400 11px/1.3 var(--mono); color: var(--ink-3); }
.card-h b { color: var(--ink-2); font-weight: 400; }
.card-h .acts { display: flex; gap: 12px; white-space: nowrap; flex: none; }
.card-h .acts button { color: var(--ink-2); } .card-h .acts button:hover { color: var(--acc); }
.card-b { padding: 12px 14px 14px; }
.tree-wrap { overflow-x: auto; padding: 6px 4px 8px; scrollbar-width: thin; }
.tree { display: block; overflow: visible; }
.tree .e { fill: none; stroke: var(--ink-3); stroke-width: 1.3; stroke-linecap: round; opacity: .55; }
.tree .e.sub { stroke: var(--ink-2); opacity: .85; }
.tree .e.path { stroke: var(--acc); stroke-width: 2.1; opacity: 1; }
.tree .e.LIKELY { stroke-dasharray: 5 4; } .tree .e.DISPUTED { stroke-dasharray: 1 4; }
.tree .e.grow { stroke-dashoffset: 0; animation: eIn .7s var(--ease) both; }
.tree .e.grow.LIKELY, .tree .e.grow.DISPUTED { animation-name: fadeIn; }
@keyframes eIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fadeIn { from { opacity: 0; } }
.tree .n { cursor: pointer; }
.tree .n circle { fill: var(--bg-2); stroke: var(--ink-3); stroke-width: 1.3; transition: transform .15s var(--ease); transform-box: fill-box; transform-origin: center; }
.tree .n.sub circle { stroke: var(--ink-2); }
.tree .n.path circle { fill: var(--acc); stroke: var(--acc); }
.tree .n.root circle { fill: var(--acc); stroke: var(--acc); }
.tree .n.focus .ring { fill: none; stroke: var(--acc); stroke-width: 1.3; opacity: .7; }
.tree .n:hover circle { transform: scale(1.35); }
.tree .n text { font: 400 11px var(--mono); fill: var(--ink-3); paint-order: stroke; stroke: var(--bg-2); stroke-width: 4px; stroke-linejoin: round; }
.tree .n.sub text { fill: var(--ink-2); }
.tree .n.path text, .tree .n.focus text { fill: var(--ink); }
.tree .n .meta { font-size: 9.5px; fill: var(--ink-3) !important; }
.tree .n:hover text { fill: var(--acc); }
.tree .n.grow { animation: fadeIn .45s ease both; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 14px 10px; border-top: 1px solid var(--rule); font: 400 10.5px/1.4 var(--mono); color: var(--ink-3); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 1.6px solid var(--ink-2); vertical-align: middle; margin-right: 6px; }
.legend i.l { border-top-style: dashed; } .legend i.d { border-top-style: dotted; border-top-width: 2px; } .legend i.p { border-color: var(--acc); }
.mut { display: grid; grid-template-columns: 128px minmax(0, 1fr) 18px minmax(0, 1fr); gap: 0 10px; }
.mut > * { padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.mut .k { font-size: 10.5px; color: var(--ink-3); padding-top: 9px; }
.mut .then { color: var(--ink-3); } .mut .arr { color: var(--ink-3); text-align: center; }
.mut .ch .arr, .mut .arr.ch { color: var(--acc); }
.mut .now.ch { color: var(--ink); } .mut .now:not(.ch) { color: var(--ink-3); }
.mut .k.ch { color: var(--acc); }
.mut-h { display: grid; grid-template-columns: 128px minmax(0, 1fr) 18px minmax(0, 1fr); gap: 0 10px; padding-bottom: 6px; font: 400 italic 22px/1.1 var(--serif); color: var(--ink-2); }
.mut-h span:first-child { font: 400 10.5px var(--mono); color: var(--ink-3); align-self: end; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--rule); text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row:hover .rn { color: var(--acc); }
.rn { font-size: 13.5px; color: var(--ink); }
.rm { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.rv { font-size: 12px; color: var(--acc); white-space: nowrap; font-variant-numeric: tabular-nums; }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.srcs a { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; text-decoration: none; font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
.srcs li:last-child a { border-bottom: 0; }
.srcs a::before { content: "↗"; color: var(--acc); }
.srcs a:hover { color: var(--ink); }

/* ---------- trace stage ---------- */
.msg.trace { width: min(1100px, calc(100vw - 32px)); align-self: center; display: grid; gap: 14px; }
.stage { position: relative; border: 1px solid var(--rule-2); border-radius: 18px; background: color-mix(in srgb, var(--bg-2) 72%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; height: 250px; transition: height .6s var(--ease); }
.st-top { position: absolute; z-index: 2; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; pointer-events: none; }
.st-top > * { pointer-events: auto; }
.st-status { display: inline-flex; align-items: center; gap: 9px; min-width: 0; font: 400 11.5px/1.2 var(--mono); color: var(--ink-3); }
.st-status b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); flex: none; }
.stage.looking .st-status i, .stage.growing .st-status i { animation: thk 1.1s var(--ease) infinite; }
.stage.grown .st-status { color: var(--ink-2); }
.st-acts button { font: 400 11.5px var(--mono); color: var(--ink-2); border-bottom: 1px dotted var(--ink-3); white-space: nowrap; }
.st-acts button:hover { color: var(--acc); border-color: var(--acc); }
.st-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.st-probe { fill: none; stroke: var(--ink-3); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: probe 1.9s var(--ease) both; }
@keyframes probe { 0% { stroke-dashoffset: 1; opacity: 0; } 15% { opacity: .75; } 60% { stroke-dashoffset: 0; opacity: .6; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.st-tip { fill: var(--ink-3); opacity: 0; animation: tip 1.3s ease both; }
@keyframes tip { 30% { opacity: .9; } 100% { opacity: 0; } }
.st-seed { fill: var(--acc); animation: seed 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes seed { 50% { transform: scale(1.35); opacity: .7; } }
.st-e { fill: none; stroke: var(--ink-3); stroke-width: 1.3; stroke-linecap: round; opacity: .7; }
.st-e.path { stroke: var(--acc); stroke-width: 2.4; opacity: 1; }
.st-e.likely { stroke-dasharray: 5 4 !important; } .st-e.disputed { stroke-dasharray: 1 4 !important; }
.st-n { cursor: pointer; outline: none; }
.st-n .hit { fill: transparent; pointer-events: all; }
.st-n .dot { fill: var(--bg-2); stroke: var(--ink-3); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; }
.st-n.path .dot, .st-n.root .dot { fill: var(--acc); stroke: var(--acc); }
.st-n .ring { fill: none; stroke: var(--acc); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; }
.stage.grown .st-n.focus .ring { animation: ring 2.4s ease-out 1s infinite; }
@keyframes ring { 0% { opacity: .9; } 60% { opacity: .25; } 100% { opacity: .9; } }
.st-n text { font: 400 12.5px var(--mono); fill: var(--ink-3); paint-order: stroke; stroke: var(--bg-2); stroke-width: 5px; stroke-linejoin: round; transform-box: fill-box; }
.st-n.path text.nm { fill: var(--ink); }
.st-n.focus text.nm { font-size: 14px; font-weight: 500; fill: var(--ink); }
.st-n .mt { font-size: 10.5px; fill: var(--ink-3); }
.st-n.path .mt { fill: var(--ink-2); }
.st-n:hover text.nm, .st-n:focus-visible text.nm { fill: var(--acc); }
.st-n:hover .dot { stroke: var(--acc); }
.result { width: min(720px, 100%); margin: 0 auto; }
.r-head { font: 400 italic clamp(30px, 4.4vw, 52px)/1.02 var(--serif); color: var(--ink); letter-spacing: -.015em; overflow-wrap: anywhere; animation: rise .5s var(--ease) both; }
.r-sub { margin: 6px 0 10px; font: 400 12px/1.5 var(--mono); color: var(--ink-3); animation: rise .5s var(--ease) .08s both; }
.r-sub b { font-weight: 400; color: var(--acc); }
.r-sub .sourced { color: var(--ink-2); }
.msg.trace .txt { color: var(--ink); }
@media (max-width: 640px) {
  .stage { border-radius: 14px; }
  .st-n text { font-size: 12.5px; }
}

/* ---------- the repositories under a tree ---------- */
.line { margin-top: 16px; border: 1px solid var(--rule-2); border-radius: 14px; background: color-mix(in srgb, var(--bg-2) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow: hidden; }
.line-t { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 14px; text-align: left; transition: background .15s; }
.line-t:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.line-avs { display: flex; flex: none; }
.line-avs .rp-av.sm { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-2); margin-left: -7px; }
.line-avs .rp-av.sm:first-child { margin-left: 0; }
.line-avs .rp-av.sm b { font-size: 10px; }
.line-s { flex: 1; min-width: 0; font: 400 12px/1.4 var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line-s b { font-weight: 500; color: var(--ink); }
.line-x { flex: none; font: 400 11.5px var(--mono); color: var(--ink-2); }
.line-x::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 2px 2px 8px; border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor; transform: rotate(45deg); transition: transform .2s var(--ease); }
.line.open .line-x::after { transform: rotate(-135deg); margin-bottom: -2px; }
.line-body { padding: 2px 8px 8px; border-top: 1px solid var(--rule); animation: rise .3s var(--ease) both; }
.line-k { margin: 12px 0 4px; padding-left: 12px; font: 400 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.rp { display: grid; grid-template-columns: auto 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; text-decoration: none; color: inherit; transition: background .15s, border-color .15s, transform .15s var(--ease); }
.rp:hover { background: color-mix(in srgb, var(--bg-2) 85%, transparent); border-color: var(--rule); }
.rp:active { transform: scale(.995); }
.rp.focus { border-color: color-mix(in srgb, var(--acc) 40%, transparent); background: color-mix(in srgb, var(--acc) 6%, transparent); }
.rp-i { width: 18px; text-align: right; font: 400 11px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rp.main .rp-i { color: var(--acc); }
.rp:not(:has(.rp-i)) { grid-template-columns: 28px minmax(0, 1fr) auto; padding-left: 42px; }
.rp-av { width: 28px; height: 28px; border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: var(--bg-3); border: 1px solid var(--rule); }
.rp-av b { font: 500 12px var(--mono); color: var(--ink-2); text-transform: lowercase; }
.rp-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rp-b { display: grid; gap: 2px; min-width: 0; }
.rp-name { font: 500 13.5px/1.3 var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-o { color: var(--ink-3); font-weight: 400; }
.rp.main .rp-name { color: var(--ink); }
.rp-desc { font-size: 12px; line-height: 1.4; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-meta { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-meta i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.rp-s { font: 400 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp.focus .rp-s, .rp.main .rp-s { color: var(--ink); }
@media (max-width: 640px) {
  .rp { gap: 10px; padding: 9px 8px; }
  .rp:not(:has(.rp-i)) { padding-left: 8px; }
  .rp-desc { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
}

/* ---------- point card ---------- */
.point { position: absolute; z-index: 45; width: min(330px, calc(100vw - 24px)); max-height: min(70vh, 520px); overflow: auto; padding: 14px 16px 12px; border-radius: 14px; border: 1px solid var(--rule-2); background: var(--bg-2); box-shadow: 0 18px 50px rgba(0, 0, 0, .35); font: 400 12.5px/1.5 var(--mono); animation: rise .25s var(--ease) both; }
.point.fixed { position: fixed; }
.point.sheet { position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; max-height: 72vh; border-radius: 18px 18px 0 0; padding: 18px 18px calc(16px + env(safe-area-inset-bottom, 0px)); }
.pt-h { padding-right: 22px; }
.pt-name { font: 400 italic 24px/1.1 var(--serif); color: var(--ink); overflow-wrap: anywhere; }
.pt-meta { margin-top: 4px; font-size: 11px; color: var(--ink-3); }
.pt-how { margin-top: 8px; font-size: 12px; color: var(--acc); }
.pt-desc { margin: 10px 0 0; font-size: 12px; color: var(--ink-2); }
.pt-k { margin: 12px 0 2px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.pt-links { list-style: none; margin: 0; padding: 0; }
.pt-links a { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; min-height: 36px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.pt-links li:last-child a { border-bottom: 0; }
.pt-links a::before { content: "↗"; color: var(--acc); flex: none; }
.pt-links a:hover { color: var(--acc); }
.pt-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pt-acts button { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-2); font-size: 12px; color: var(--ink-2); }
.pt-acts button:first-child { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pt-acts button:active { transform: scale(.97); }
.pt-x { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; font-size: 20px; line-height: 1; color: var(--ink-3); }
.r-sub .hint { color: var(--ink-3); }
@media (max-width: 640px) { .r-sub .hint { display: block; } }

/* ---------- $FORK: /freeforks ---------- */
.ask-sub { display: flex; justify-content: center; margin-top: 10px; }
.quest { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; border-radius: 999px; border: 1px dashed color-mix(in srgb, var(--warn) 55%, transparent); background: var(--veil); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 400 12px/1 var(--mono); color: var(--ink-2); transition: color .15s, border-color .15s, transform .15s var(--ease); }
.quest b { color: var(--warn); font-weight: 500; font-variant-numeric: tabular-nums; }
.quest:hover { color: var(--ink); border-style: solid; }
.quest:active { transform: translateY(1px) scale(.98); }
.quest.has { border-style: solid; border-color: var(--rule-2); }
body.chat .ask-sub { margin-top: 8px; }
.pill.me { color: var(--ink); gap: 6px; }
.pill.me img, .pill.me .ini { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.pill.me .ini { display: grid; place-items: center; background: var(--bg-3); font-size: 10px; color: var(--ink-2); text-transform: uppercase; }
.pill.me .amt { font-variant-numeric: tabular-nums; }
.pill.me .demo, .card-h b.demo { font-size: 9.5px; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 999px; padding: 1px 5px; }
.pill.me svg { width: 12px; height: 12px; }
.quest-card .card-b { display: grid; gap: 10px; }
.q-task { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.q-title { font-size: 14px; color: var(--ink); }
.q-reward { margin-top: 3px; font-size: 12px; color: var(--warn); font-variant-numeric: tabular-nums; }
.q-reward span { color: var(--ink-3); }
.q-reward.ok { color: var(--acc); }
.q-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 11px; background: var(--ink); color: var(--bg); font: 500 13px/1 var(--mono); text-decoration: none; white-space: nowrap; flex: none; transition: transform .15s var(--ease), opacity .15s; }
.q-btn:active { transform: translateY(1px) scale(.98); }
.q-btn.busy { opacity: .35; pointer-events: none; }
.q-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule-2); }
.q-btn.x svg { width: 15px; height: 15px; }
.q-state { display: grid; gap: 6px; font-size: 11px; color: var(--ink-3); }
.q-state.err .q-msg { color: var(--err); }
.q-bar { height: 2px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.q-bar i { display: block; height: 100%; width: 0; background: var(--warn); transition: width linear; }
.quest-card.done { border-color: color-mix(in srgb, var(--acc) 35%, var(--rule-2)); }
.q-row { display: flex; gap: 8px; }
.q-in { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--rule-2); background: var(--bg); color: var(--ink); font: 400 14px var(--mono); outline: none; }
.q-in:focus { border-color: color-mix(in srgb, var(--acc) 55%, transparent); }
.q-note { margin: 0; font-size: 11px; color: var(--ink-3); }
.q-done { font-size: 13px; color: var(--acc); }
.mono { font-variant-numeric: tabular-nums; }
.q-sum { display: grid; gap: 8px; }
.q-who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; }
.q-who img { border-radius: 50%; }
.q-big { font: 400 44px/1 var(--serif); color: var(--ink); }
.q-big span { font: 400 12px var(--mono); color: var(--warn); margin-left: 4px; }
.q-meta { font-size: 11px; color: var(--ink-3); }
.q-acts { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
.q-link { font-size: 12px; color: var(--ink-3); border-bottom: 1px dotted var(--ink-3); }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--rule-2); background: var(--bg-2); color: var(--ink); font: 400 12.5px/1.4 var(--mono); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); animation: rise .3s var(--ease) both; transition: opacity .3s; }
.toast.out { opacity: 0; }

/* ---------- dock (chat mode) ---------- */
.dock { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; padding: 26px var(--gut-r) calc(16px + env(safe-area-inset-bottom, 0px)) var(--gut); display: none; justify-content: center; background: linear-gradient(to bottom, transparent, var(--bg) 46%); }
body.chat .dock { display: flex; }

/* ---------- full tree ---------- */
.full { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; grid-template-rows: auto 1fr auto; animation: fadeIn .25s ease both; }
.full[hidden] { display: none; }
.full-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) var(--gut-r) 12px var(--gut); }
.full-h h2 { margin: 0; font: 400 italic clamp(26px, 3.2vw, 40px)/1 var(--serif); }
.full-h p { margin: 4px 0 0; font-size: 11.5px; color: var(--ink-3); }
.full-b { overflow: auto; padding: 10px var(--gut-r) 20px var(--gut); }
.full .tree .n text { stroke: var(--bg); font-size: 12.5px; }
.full .tree .n .meta { font-size: 10.5px; }
.full .legend { border-top: 1px solid var(--rule); padding: 12px var(--gut-r) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gut); }

@media (max-width: 640px) {
  .hero { gap: 18px; padding-top: 80px; }
  .q { font-size: clamp(42px, 13vw, 60px); }
  .chips { gap: 6px; }
  .chip { font-size: 12px; }
  .pill .lbl { display: none; }
  .pill .mob { display: block; }
  .pill.me { padding: 0 7px; }
  .pill.me .demo, .pill.me .tk { display: none; }
  .q-task { flex-wrap: wrap; }
  .q-big { font-size: 38px; }
  .pill { padding: 0 9px; }
  .mut, .mut-h { grid-template-columns: 92px minmax(0, 1fr) 14px minmax(0, 1fr); gap: 0 6px; }
  .mut > * { font-size: 11.5px; }
  .msg.up { grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
  .av { width: 22px; height: 22px; }
  .fine { font-size: 10.5px; }
}
@media (max-width: 420px) {
  .pill.gh { display: none; }
}
@media (max-width: 360px) {
  .pill.me .amt { display: none !important; }
  .pill.me { width: 30px; padding: 0; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<header class="top">
  <a class="brand" href="#" id="home" aria-label="forks, start over">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20V3.6"/><path d="M9 14.4C9 10 15.4 10.5 15.4 6.8"/><circle class="d" cx="9" cy="20" r="2.4"/><circle class="e" cx="15.4" cy="5.1" r="1.8"/></svg>
    forks
  </a>
  <nav class="pills" aria-label="Site">
    <button class="pill" type="button" id="newBtn">new</button>
    <button class="pill me" type="button" id="meBtn" hidden></button>
    <a class="pill icon gh" href="https://github.com/forkwiki/fork" target="_blank" rel="noopener" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    <button class="pill icon" type="button" id="themeBtn" aria-label="Switch light or dark"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg></button>
  </nav>
</header>

<main>
  <section class="hero" aria-label="Ask">
    <div>
      <h1 class="q" id="q" aria-label="where did it come from?"></h1>
      <svg class="q-fork" viewBox="0 0 420 22" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 4H300C340 4 336 18 380 18"/><circle cx="384" cy="18" r="3"/></svg>
    </div>
    <div id="askSlot"></div>
    <div class="chips" id="chips"></div>
  </section>
  <ol class="thread" id="thread" aria-live="polite"></ol>
</main>

<div class="dock" id="dock"></div>
<p class="fine" id="fine"></p>

<form class="ask" id="ask" autocomplete="off">
  <label class="sr" for="inp">Ask where something came from</label>
  <div class="ask-row">
    <input id="inp" type="text" maxlength="400" spellcheck="false" enterkeyhint="send">
    <button class="send" id="sendBtn" type="submit" aria-label="Trace it" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6"/></svg></button>
  </div>
  <div class="ask-sub"><button class="quest" type="button" id="questBtn">get <b>+5,000</b> $FORK</button></div>
</form>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="point" id="point" role="dialog" aria-label="About this point" hidden></div>

<div class="full" id="full" hidden role="dialog" aria-modal="true" aria-labelledby="fullTitle">
  <div class="full-h"><div><h2 id="fullTitle"></h2><p id="fullSub"></p></div><button class="pill" type="button" id="fullX">close<span class="lbl"> · esc</span></button></div>
  <div class="full-b" id="fullB"></div>
  <div class="legend" id="fullLegend"></div>
</div>

<script src="src/config.js"></script>
<script src="src/field.js"></script>
<script src="src/prompt.js"></script>
<script src="src/brain.js"></script>
<script src="src/stage.js"></script>
<script src="src/quest.js"></script>
<script src="src/app.js"></script>
</body>
</html>
