[build]
  publish = "."
  functions = "netlify/functions"

# forks.wiki/r/<handle> — a friend's invite link
[[redirects]]
  from = "/r/:code"
  to = "/?ref=:code"
  status = 302

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
