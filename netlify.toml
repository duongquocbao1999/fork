[build]
  publish = "."
  functions = "netlify/functions"

# a coin's terminal: forks.wiki/coin/<mint>
[[redirects]]
  from = "/coin/*"
  to = "/coin.html"
  status = 200

# forks.wiki/r/<handle> — a friend's invite link
[[redirects]]
  from = "/r/:code"
  to = "/?ref=:code"
  status = 302

[functions]
  node_bundler = "esbuild"

# the launch function ships pump.fun's SDK and Solana's libraries as plain node_modules (run npm install before deploying)
[functions.launch]
  external_node_modules = ["@pump-fun/pump-sdk", "@solana/web3.js", "@solana/spl-token", "@coral-xyz/anchor", "bn.js"]
[functions.market]
  external_node_modules = ["@pump-fun/pump-sdk", "@solana/web3.js", "@solana/spl-token", "@coral-xyz/anchor", "bn.js"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# link-preview cards: each version has its own file name, so it can be cached for good
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
